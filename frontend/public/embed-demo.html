<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服嵌入式演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .demo-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { margin-bottom: 20px; color: #333; }
        p { color: #666; margin-bottom: 30px; }
        .open-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .open-btn:hover { background: #4338ca; }

        /* 客服弹窗容器 */
        .chat-widget-overlay {
            position: fixed;
            right: 20px;
            bottom: 80px;
            width: 400px;
            height: 600px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
            display: none;
            z-index: 9999;
            background: white;
            flex-direction: column;
        }
        .chat-widget-overlay.active {
            display: flex;
        }
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            user-select: none;
        }
        .chat-header h3 { font-size: 16px; }
        .close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }
        .chat-iframe {
            flex: 1;
            border: none;
            width: 100%;
        }
        /* 右下角浮动按钮 */
        .floating-btn {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4f46e5;
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79,70,229,0.4);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .floating-btn:hover { transform: scale(1.1); }
        .floating-btn.hidden { display: none; }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>某 SaaS 管理后台</h1>
        <p>这是一个模拟的业务页面，右下角已集成 AI 智能客服</p>
        <button class="open-btn" onclick="openChat()">📖 打开智能客服演示</button>
    </div>

    <!-- 右下角浮动按钮 -->
    <button class="floating-btn" id="floatBtn" onclick="toggleChat()">💬</button>

    <!-- 客服弹窗 -->
    <div class="chat-widget-overlay" id="chatWidget">
        <div class="chat-header" id="chatHeader">
            <h3>🤖 智能客服助手</h3>
            <button class="close-btn" onclick="toggleChat()">✕</button>
        </div>
        <iframe
            class="chat-iframe"
            id="chatIframe"
            src="https://rag-knowledge-bot.vercel.app/"
            title="智能客服"
        ></iframe>
    </div>

    <script>
        const widget = document.getElementById('chatWidget');
        const floatBtn = document.getElementById('floatBtn');
        const chatIframe = document.getElementById('chatIframe');

        // ⚠️ 请替换为你的实际 RAG 前端部署地址
        const CHAT_URL = 'https://rag-knowledge-bot.vercel.app/s';
        chatIframe.src = CHAT_URL;

        function toggleChat() {
            const isActive = widget.classList.contains('active');
            if (isActive) {
                widget.classList.remove('active');
                floatBtn.classList.remove('hidden');
            } else {
                widget.classList.add('active');
                floatBtn.classList.add('hidden');
            }
        }

        function openChat() {
            widget.classList.add('active');
            floatBtn.classList.add('hidden');
        }

        // 拖拽功能
        let isDragging = false;
        let offsetX, offsetY;
        const chatHeader = document.getElementById('chatHeader');

        chatHeader.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - widget.getBoundingClientRect().left;
            offsetY = e.clientY - widget.getBoundingClientRect().top;
            widget.style.transition = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const x = e.clientX - offsetX;
            const y = e.clientY - offsetY;
            widget.style.left = x + 'px';
            widget.style.top = y + 'px';
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            widget.style.transition = '';
        });
    </script>
</body>
</html>
